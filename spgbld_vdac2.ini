Desc = Zuma VDAC2
Start = 0x5C00
Stack = 0x40F2
Resident = 0x5B00
Page3 = 0
Clock = 2
INT = 0
Pager = 0x0

Compression = 0

Block = #1000, #00, TSLib.bin
Block = #5C00, #05, Core.bin
Block = #C000, #04, main1_play.bin
Block = #0000, #06, Graphics/Converted/track_640.bin

; --- bg = 400x300 PALETTED4444 + 512B ARGB4 palette.
;     120000 bytes -> 8 pages #07..#0E (last padded), palette on page #0F.
Block = #0000, #07, Graphics/Converted/bg_paletted_p00.bin
Block = #0000, #08, Graphics/Converted/bg_paletted_p01.bin
Block = #0000, #09, Graphics/Converted/bg_paletted_p02.bin
Block = #0000, #0A, Graphics/Converted/bg_paletted_p03.bin
