Block = #0000, #0E, Graphics/Converted/bg_paletted_p07.bin
Block = #0000, #0F, Graphics/Converted/bg_palette_argb4.bin

; --- balls_atlas PALETTED4444: 6×32×32×32 1bpp = 192K, 12 SPG pages #2D..#38.
; Palette ARGB4 СТРОГО 512 байт (256 colors × 2 bytes) на page #39 → FT_RAM_G #080000
; (4-byte aligned). FT_PaletteSource перед draw устанавливает указатель.
Block = #0000, #2D, Graphics/Converted/balls_atlas_paletted_p00_zx7.bin
Block = #0000, #2E, Graphics/Converted/balls_atlas_paletted_p01_zx7.bin
Block = #0000, #2F, Graphics/Converted/balls_atlas_paletted_p02_zx7.bin
