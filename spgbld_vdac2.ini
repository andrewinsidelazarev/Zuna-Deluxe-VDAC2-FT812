Block = #0000, #31, Graphics/Converted/balls_atlas_paletted_p04_zx7.bin
Block = #0000, #32, Graphics/Converted/balls_atlas_paletted_p05_zx7.bin
Block = #0000, #33, Graphics/Converted/balls_atlas_paletted_p06_zx7.bin
Block = #0000, #34, Graphics/Converted/balls_atlas_paletted_p07_zx7.bin
Block = #0000, #35, Graphics/Converted/balls_atlas_paletted_p08_zx7.bin
Block = #0000, #36, Graphics/Converted/balls_atlas_paletted_p09_zx7.bin
Block = #0000, #37, Graphics/Converted/balls_atlas_paletted_p10_zx7.bin
Block = #0000, #38, Graphics/Converted/balls_atlas_paletted_p11_zx7.bin
Block = #0000, #39, Graphics/Converted/balls_palette_argb4.bin        ; 512 байт ARGB4 + padding

