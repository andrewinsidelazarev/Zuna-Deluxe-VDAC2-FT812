; --- HUD top bar (lives counter): life_frog 20×20 PALETTED4444 + 512B ARGB4 palette.
;     Raw upload (no ZX7), 1 page each, 4-byte aligned in RAM_G.
Block = #0000, #5B, Graphics/Converted/life_frog.bin
